[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillsctl"
version = "0.2.0"
description = "CLI tool for installing skills, agents, workflows, and rules from an Enterprise Skills Catalog"
readme = "README.md"
license = {text = "MIT"}
license-files = []
requires-python = ">=3.10"
authors = [
    {name = "Yash Shingvi"},
]
keywords = ["skills", "catalog", "cli", "enterprise", "agents", "workflows", "ai", "prompts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
skillsctl = "skillsctl.main:cli"

[project.urls]
Homepage = "https://github.com/yashshingvi/skillsctl"
Repository = "https://github.com/yashshingvi/skillsctl"
Issues = "https://github.com/yashshingvi/skillsctl/issues"
"Skills Catalog Server" = "https://github.com/yashshingvi/skills-catalog"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsctl"]
